name: Runner env probe
on:
  issues:
    types: [opened]
jobs:
  probe:
    if: startsWith(github.event.issue.title, 'probe-runner')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 18
    steps:
      - name: probe
        shell: bash
        env:
          HERMES_HOME: C:\Users\d5dx\AppData\Local\hermes\profiles\wiki-runner
          HERMES_BIN: C:/Users/d5dx/AppData/Local/hermes/hermes-agent/venv/Scripts/hermes.exe
          PYSPY_EXE: C:/Users/d5dx/.local/bin/py-spy.exe
        run: |
          set -uo pipefail
          export PYTHONUNBUFFERED=1
          echo "start=$(date +%T)"
          set +e
          timeout 240 "$HERMES_BIN" chat -q "reply with exactly OK" > "$RUNNER_TEMP/chat1.log" 2>&1
          rc=$?
          set -e
          echo "CHAT_RC=$rc end=$(date +%T)"
          wc -c "$RUNNER_TEMP/chat1.log"
          tail -25 "$RUNNER_TEMP/chat1.log"
          exit 0
