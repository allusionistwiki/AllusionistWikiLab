name: Runner env probe
on:
  issues:
    types: [opened]
jobs:
  probe:
    if: startsWith(github.event.issue.title, 'probe-runner')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 18
    steps:
      - name: probe
        shell: bash
        env:
          HERMES_HOME: C:\Users\d5dx\AppData\Local\hermes\profiles\wiki-runner
          HERMES_BIN: C:/Users/d5dx/AppData/Local/hermes/hermes-agent/venv/Scripts/hermes.exe
        run: |
          set -uo pipefail
          export PYTHONUNBUFFERED=1
          echo "start=$(date +%T)"
          timeout 900 "$HERMES_BIN" chat -q "reply with exactly OK" > "$RUNNER_TEMP/chat1.log" 2>&1
          echo "CHAT_RC=$? end=$(date +%T)"
          tail -25 "$RUNNER_TEMP/chat1.log"
          exit 0
