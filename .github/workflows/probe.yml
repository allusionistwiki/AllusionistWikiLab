name: Runner env probe
on:
  issues:
    types: [opened]
jobs:
  probe:
    if: startsWith(github.event.issue.title, 'probe-runner')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: probe
        shell: bash
        env:
          HERMES_HOME: C:\Users\d5dx\AppData\Local\hermes\profiles\wiki-runner
          HERMES_BIN: C:/Users/d5dx/AppData/Local/hermes/hermes-agent/venv/Scripts/hermes.exe
        run: |
          set -uo pipefail
          export PYTHONUNBUFFERED=1
          "$HERMES_BIN" chat -q "reply with exactly OK" > "$RUNNER_TEMP/chat1.log" 2>&1 &
          CPID=$!
          sleep 45
          echo "=== windowed procs ==="
          tasklist //v //fo csv 2>/dev/null | grep -ai "python\|hermes\|uv" | head -12
          echo "=== tree ==="
          tasklist //fo tree 2>/dev/null | grep -ai "python\|hermes\|uv\|conhost\|cmd" | head -20
          echo "=== chat1.log ==="
          wc -c "$RUNNER_TEMP/chat1.log"
          tail -10 "$RUNNER_TEMP/chat1.log"
          taskkill //T //F //PID $CPID 2>&1 | head -3
          exit 0
