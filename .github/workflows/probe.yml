name: Runner env probe
on:
  issues:
    types: [opened]
jobs:
  probe:
    if: startsWith(github.event.issue.title, 'probe-runner')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 18
    steps:
      - name: probe
        shell: bash
        env:
          HERMES_HOME: C:\Users\d5dx\AppData\Local\hermes\profiles\wiki-runner
          HERMES_BIN: C:/Users/d5dx/AppData/Local/hermes/hermes-agent/venv/Scripts/hermes.exe
          PYSPY_EXE: C:/Users/d5dx/.local/bin/py-spy.exe
        run: |
          set -uo pipefail
          export PYTHONUNBUFFERED=1
          "$HERMES_BIN" chat -q "reply with exactly OK" > "$RUNNER_TEMP/chat1.log" 2>&1 &
          CPID=$!
          sleep 90
          tasklist //v //fo csv //fi "IMAGENAME eq python.exe" | tr -d '"' | awk -F',' 'NR>1 {print $6","$2}' | while read line; do
            ct=${line%%,*}; pid=${line##*,}
            h=$(echo "$ct" | cut -d: -f1); m=$(echo "$ct" | cut -d: -f2); s=$(echo "$ct" | cut -d: -f3)
            echo $((10#$h*3600 + 10#$m*60 + 10#$s)) "$pid"
          done | sort -rn | head -3 | awk '{print $2}' > "$RUNNER_TEMP/pys.txt"
          cat "$RUNNER_TEMP/pys.txt"
          for p in $(cat "$RUNNER_TEMP/pys.txt"); do
            echo "=== dump pid=$p ==="
            "$PYSPY_EXE" dump --pid "$p" 2>&1 | head -45
          done
          wc -c "$RUNNER_TEMP/chat1.log"
          taskkill //T //F //PID $CPID 2>&1 | head -2
          exit 0
