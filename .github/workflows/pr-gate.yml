name: PR gate (mechanical)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.checks.outputs.verdict }}
      build: ${{ steps.build.outcome }}
      reasons: ${{ steps.checks.outputs.reasons }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Mechanical checks
        id: checks
        run: |
          python3 scripts/pr_gate_checks.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | tee /dev/stdout | tr -d '\r' >> "$GITHUB_OUTPUT"

      - name: Build check
        id: build
        if: steps.checks.outputs.verdict == 'PASS'
        run: |
          npm ci
          npx quartz build

  # Merge on the self-hosted Windows service runner. Merges must land as owner
  # pushes: GITHUB_TOKEN merges do NOT fire the post-merge audit + deploy
  # workflows. The PAT comes from the repo secret PAT_TOKEN (set in Settings →
  # Secrets and variables → Actions) — the runner user cannot read any PAT file.
  # NOTE: the service PATH has NO gh CLI — use curl only. Tokens live in bash env
  # ($PAT), never inlined as literals. Payloads are built as JSON files by python
  # (argv pass-through: attacker-controlled text cannot break the JSON/shell).
  merge:
    needs: gate
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, Windows, X64]
    env:
      PAT: ${{ secrets.PAT_TOKEN }}
      N: ${{ github.event.pull_request.number }}
      PYTHONIOENCODING: "utf-8"
      VERDICT: ${{ needs.gate.outputs.verdict }}
      BUILD: ${{ needs.gate.outputs.build }}
      REASONS: ${{ needs.gate.outputs.reasons }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Review and auto-merge
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          : "${PAT:?PAT_TOKEN secret is not set}"
          # strip copied-in whitespace/newlines from the secret value (common "Bad credentials" cause)
          PAT="${PAT//[[:space:]]/}"
          comment() {
            python - "$1" "$RUNNER_TEMP/cmt.json" <<'PY'
          import json, sys
          json.dump({"body": sys.argv[1]}, open(sys.argv[2], "w", encoding="utf-8"))
          PY
            curl -s -o /dev/null -X POST -H "Authorization: Bearer $PAT" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/cmt.json" "$API/issues/$N/comments"
          }
          fetch() {
            # fetch JSON with retry (PR/commits APIs can transiently 404 for 1-2 min after bot merges)
            for i in $(seq 1 12); do
              code=$(curl -s -o "$2" -w "%{http_code}" -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "$1")
              if [ "$code" = "200" ] && python -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$2" 2>/dev/null; then return 0; fi
              echo "fetch-attempt $i url=$1 http=$code body=$(head -c 120 "$2" 2>/dev/null)"
              sleep 15
            done
            return 1
          }
          fetch "$API/issues/$N" "$RUNNER_TEMP/issue.json" || exit 1
          labels=$(python -c "import json,sys;print(','.join(l['name'] for l in json.load(open(sys.argv[1], encoding='utf-8')).get('labels',[])))" "$RUNNER_TEMP/issue.json")
          # headmsg via PR commits endpoint (Pull requests scope); /commits/{sha} needs Contents read which the PAT lacks
          fetch "$API/pulls/$N/commits?per_page=100" "$RUNNER_TEMP/pcommits.json" || exit 1
          headmsg=$(python -c "import json,sys;print(next((c['commit']['message'].splitlines()[0] for c in json.load(open(sys.argv[1], encoding='utf-8')) if c['commit']['message'].startswith('llm-task: implement')), ''))" "$RUNNER_TEMP/pcommits.json")
          if [ "$VERDICT" = "PASS" ] && [ "$BUILD" = "success" ]; then
            if echo "$labels" | grep -q "llm-task" && ! echo "$headmsg" | grep -q "^llm-task: implement"; then
              comment "pr-gate PASS — llm-task PR, holding merge until LLM implementation commit lands."
            else
              comment "pr-gate PASS (paths / deletion ratio / links / build). Auto-merged by pr-gate. verdict=$VERDICT build=$BUILD"
              # pin the audited head: a force-push after gate returns 409, merge never swallows it
              python - "$HEAD_SHA" "$RUNNER_TEMP/merge.json" <<'PY'
          import json, sys
          json.dump({"merge_method": "squash", "sha": sys.argv[1]}, open(sys.argv[2], "w", encoding="utf-8"))
          PY
              code=$(curl -s -o "$RUNNER_TEMP/mergeresp.json" -w "%{http_code}" -X PUT -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/merge.json" "$API/pulls/$N/merge")
              echo "merge http=$code body=$(head -c 200 "$RUNNER_TEMP/mergeresp.json" 2>/dev/null) (head sha pinned: $HEAD_SHA)"
              case "$code" in 200|204) ;; *) exit 1;; esac
              fetch "$API/pulls/$N" "$RUNNER_TEMP/pr.json" || exit 1
              head_ref=$(python -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['head']['ref'])" "$RUNNER_TEMP/pr.json")
              curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "$API/git/refs/heads/$head_ref" || true
            fi
          else
            python - "$REASONS" "$VERDICT" "$BUILD" "$RUNNER_TEMP/review.json" <<'PY'
          import json, sys
          reasons, verdict, build = sys.argv[1:4]
          json.dump({"action": "request_changes", "body": f"pr-gate FAIL: verdict={verdict} build={build} — {reasons}"}, open(sys.argv[4], "w", encoding="utf-8"))
          PY
            # reviews on owner-created PRs need a reviewer identity distinct from the author:
            # GITHUB_TOKEN (the bot), not the PAT.
            curl -s -o /dev/null -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Content-Type: application/json" --data @"$RUNNER_TEMP/review.json" "$API/pulls/$N/reviews" || true
            comment "pr-gate decision: verdict=$VERDICT build=$BUILD reasons=$REASONS"
          fi
