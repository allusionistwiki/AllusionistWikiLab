name: PR gate (mechanical)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Mechanical checks
        id: checks
        run: |
          python3 scripts/pr_gate_checks.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | tee /dev/stdout | tr -d '\r' >> "$GITHUB_OUTPUT"

      - name: Build check
        id: build
        if: steps.checks.outputs.verdict == 'PASS'
        run: |
          npm ci
          npx quartz build

      - name: Review and auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PAT_FILE: C:/Users/d5dx/AppData/Local/hermes/profiles/awiki2/secrets/ghtok.txt
        run: |
          n=${{ github.event.pull_request.number }}
          verdict="${{ steps.checks.outputs.verdict }}"
          build="${{ steps.build.outcome }}"
          reasons="${{ steps.checks.outputs.reasons }}"
          labels=$(gh pr view "$n" --json labels --jq '.labels[].name' | tr '\n' ',')
          headmsg=$(git log -1 --format=%s "${{ github.event.pull_request.head.sha }}")
          if [ "$verdict" = "PASS" ] && [ "$build" = "success" ]; then
            if echo "$labels" | grep -q "llm-task" && ! echo "$headmsg" | grep -q "^llm-task: implement"; then
              gh pr comment "$n" --body "pr-gate PASS — llm-task PR, holding merge until LLM implementation commit lands."
            else
              gh pr comment "$n" --body "pr-gate PASS (paths / deletion ratio / links / build). Auto-merged by pr-gate. verdict=$verdict build=$build"
              # merge with PAT (owner) so the merge push triggers deploy + audit
              # (GITHUB_TOKEN merges do NOT fire workflows)
              if [ -f "$PAT_FILE" ]; then
                export GH_TOKEN=$(cat "$PAT_FILE")
              fi
              gh pr merge "$n" --squash --delete-branch
            fi
          else
            gh pr review "$n" --request-changes --body "pr-gate FAIL: verdict=$verdict build=$build — $reasons" || true
            gh pr comment "$n" --body "pr-gate decision: verdict=$verdict build=$build reasons=$reasons"
          fi
