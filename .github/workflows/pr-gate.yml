name: PR gate (mechanical)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.checks.outputs.verdict }}
      build: ${{ steps.build.outcome }}
      reasons: ${{ steps.checks.outputs.reasons }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Mechanical checks
        id: checks
        run: |
          python3 scripts/pr_gate_checks.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | tee /dev/stdout | tr -d '\r' >> "$GITHUB_OUTPUT"

      - name: Build check
        id: build
        if: steps.checks.outputs.verdict == 'PASS'
        run: |
          npm ci
          npx quartz build

  # Merge on the self-hosted Windows service runner. Merges must land as owner
  # pushes: GITHUB_TOKEN merges do NOT fire the post-merge audit + deploy
  # workflows. The PAT comes from the repo secret PAT_TOKEN (set in Settings →
  # Secrets and variables → Actions) — the runner user cannot read any PAT file.
  merge:
    needs: gate
    runs-on: [self-hosted, Windows, X64]
    env:
      PAT: ${{ secrets.PAT_TOKEN }}
      N: ${{ github.event.pull_request.number }}
      VERDICT: ${{ needs.gate.outputs.verdict }}
      BUILD: ${{ needs.gate.outputs.build }}
      REASONS: ${{ needs.gate.outputs.reasons }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Review and auto-merge
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          : "${PAT:?PAT_TOKEN secret is not set}"
          comment() {
            payload=$(python -c 'import json,sys;print(json.dumps({"body":sys.argv[1]}))' "$1")
            curl -s -o /dev/null -X POST -H "Authorization: Bearer $PAT" -H "Content-Type: application/json" -d "$payload" "$API/issues/$N/comments"
          }
          labels=$(curl -s -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "$API/issues/$N" | python -c "import sys,json;print(','.join(l['name'] for l in json.load(sys.stdin).get('labels',[])))")
          headmsg=$(curl -s -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "$API/commits/$HEAD_SHA" | python -c "import sys,json;print(json.load(sys.stdin)['commit']['message'].splitlines()[0])")
          if [ "$VERDICT" = "PASS" ] && [ "$BUILD" = "success" ]; then
            if echo "$labels" | grep -q "llm-task" && ! echo "$headmsg" | grep -q "^llm-task: implement"; then
              comment "pr-gate PASS — llm-task PR, holding merge until LLM implementation commit lands."
            else
              comment "pr-gate PASS (paths / deletion ratio / links / build). Auto-merged by pr-gate. verdict=$VERDICT build=$BUILD"
              code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -d '{"merge_method":"squash"}' "$API/pulls/$N/merge")
              echo "merge http=$code"
              [ "$code" = "204" ] || exit 1
              head_ref=$(curl -s -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "$API/pulls/$N" | python -c "import sys,json;print(json.load(sys.stdin)['head']['ref'])")
              curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "$API/git/refs/heads/$head_ref" || true
            fi
          else
            curl -s -o /dev/null -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Content-Type: application/json" -d "{\"action\":\"request_changes\",\"body\":\"pr-gate FAIL: verdict=$VERDICT build=$BUILD — $REASONS\"}" "$API/pulls/$N/reviews" || true
            comment "pr-gate decision: verdict=$VERDICT build=$BUILD reasons=$REASONS"
          fi
