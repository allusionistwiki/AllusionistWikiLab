name: PR gate (mechanical)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.checks.outputs.verdict }}
      build: ${{ steps.build.outcome }}
      reasons: ${{ steps.checks.outputs.reasons }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Mechanical checks
        id: checks
        run: |
          python3 scripts/pr_gate_checks.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | tee /dev/stdout | tr -d '\r' >> "$GITHUB_OUTPUT"

      - name: Build check
        id: build
        if: steps.checks.outputs.verdict == 'PASS'
        run: |
          npm ci
          npx quartz build

  # Merge on the self-hosted Windows service runner. Merges must land as owner
  # pushes: GITHUB_TOKEN merges do NOT fire the post-merge audit + deploy
  # workflows. The PAT comes from the repo secret PAT_TOKEN (set in Settings →
  # Secrets and variables → Actions) — the runner user cannot read any PAT file.
  merge:
    needs: gate
    runs-on: [self-hosted, Windows, X64]
    env:
      PAT: ${{ secrets.PAT_TOKEN }}
      N: ${{ github.event.pull_request.number }}
      VERDICT: ${{ needs.gate.outputs.verdict }}
      BUILD: ${{ needs.gate.outputs.build }}
      REASONS: ${{ needs.gate.outputs.reasons }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge diagnostics (A/B of probe vs merge-step conditions)
        shell: bash
        env:
          PAT: ${{ secrets.PAT_TOKEN }}
        run: |
          PAT="${PAT//[[:space:]]/}"
          echo "diag event=${{ github.event_name }} len=${#PAT} prefix=${PAT:0:10}****"
          c1=$(curl -s -o "$RUNNER_TEMP/d1.json" -w "%{http_code}" -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/issues/$N")
          echo "diag issues http=$c1 body=$(head -c 80 "$RUNNER_TEMP/d1.json")"
          c2=$(curl -s -o "$RUNNER_TEMP/d2.json" -w "%{http_code}" -H "Authorization: Bearer github.token rendered value not available here" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO")
          echo "diag bad-token http=$c2"
          c3=$(curl -s -o "$RUNNER_TEMP/d3.json" -w "%{http_code}" "https://api.github.com/")
          echo "diag no-auth http=$c3"
      - name: Review and auto-merge
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          : "${PAT:?PAT_TOKEN secret is not set}"
          # strip copied-in whitespace/newlines from the secret value (common "Bad credentials" cause)
          PAT="${PAT//[[:space:]]/}"
          echo "pat-fingerprint len=${#PAT} prefix=${PAT:0:4}****"
          comment() {
            payload=$(python -c 'import json,sys;print(json.dumps({"body":sys.argv[1]}))' "$1")
            curl -s -o /dev/null -X POST -H "Authorization: Bearer $PAT" -H "Content-Type: application/json" -d "$payload" "$API/issues/$N/comments"
          }
          fetch() {
            # fetch JSON with retry (GitHub commit API can transiently 404 for 1-2 min after bot merge commits)
            for i in $(seq 1 12); do
              code=$(curl -s -o "$2" -w "%{http_code}" -H "Authorization: Bearer ***" -H "Accept: application/vnd.github+json" "$1")
              if python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); sys.exit(1 if ('message' in d and 'sha' not in d) else 0)" "$2"; then return 0; fi
              echo "fetch-attempt $i url=$1 http=$code body=$(head -c 120 "$2" 2>/dev/null)"
              sleep 15
            done
            return 1
          }
          fetch "$API/issues/$N" "$RUNNER_TEMP/issue.json" || exit 1
          labels=$(python -c "import json,sys;print(','.join(l['name'] for l in json.load(open(sys.argv[1], encoding='utf-8')).get('labels',[])))" "$RUNNER_TEMP/issue.json")
          # headmsg via PR commits endpoint (Pull requests scope); /commits/{sha} needs Contents read which the PAT lacks
          fetch "$API/pulls/$N/commits?per_page=100" "$RUNNER_TEMP/pcommits.json" || exit 1
          headmsg=$(python -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))[-1]['commit']['message'].splitlines()[0])" "$RUNNER_TEMP/pcommits.json")
          if [ "$VERDICT" = "PASS" ] && [ "$BUILD" = "success" ]; then
            if echo "$labels" | grep -q "llm-task" && ! echo "$headmsg" | grep -q "^llm-task: implement"; then
              comment "pr-gate PASS — llm-task PR, holding merge until LLM implementation commit lands."
            else
              comment "pr-gate PASS (paths / deletion ratio / links / build). Auto-merged by pr-gate. verdict=$VERDICT build=$BUILD"
              code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" -d '{"merge_method":"squash"}' "$API/pulls/$N/merge")
              echo "merge http=$code"
              [ "$code" = "204" ] || exit 1
              head_ref=$(curl -s -H "Authorization: Bearer ***" -H "Accept: application/vnd.github+json" "$API/pulls/$N" -o "$RUNNER_TEMP/pr.json" && python -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['head']['ref'])" "$RUNNER_TEMP/pr.json")
              curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "$API/git/refs/heads/$head_ref" || true
            fi
          else
            curl -s -o /dev/null -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Content-Type: application/json" -d "{\"action\":\"request_changes\",\"body\":\"pr-gate FAIL: verdict=$VERDICT build=$BUILD — $REASONS\"}" "$API/pulls/$N/reviews" || true
            comment "pr-gate decision: verdict=$VERDICT build=$BUILD reasons=$REASONS"
          fi
