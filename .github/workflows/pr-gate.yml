name: PR gate (mechanical)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.checks.outputs.verdict }}
      build: ${{ steps.build.outcome }}
      reasons: ${{ steps.checks.outputs.reasons }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Mechanical checks
        id: checks
        run: |
          python3 scripts/pr_gate_checks.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | tee /dev/stdout | tr -d '\r' >> "$GITHUB_OUTPUT"

      - name: Build check
        id: build
        if: steps.checks.outputs.verdict == 'PASS'
        run: |
          npm ci
          npx quartz build

  # Merge on the self-hosted Windows service runner. Merges must land as owner
  # pushes: GITHUB_TOKEN merges do NOT fire the post-merge audit + deploy
  # workflows. The PAT comes from the repo secret PAT_TOKEN (set in Settings →
  # Secrets and variables → Actions) — the runner user cannot read any PAT file.
  # All API calls go through `gh api` so the token never lands in process args,
  # and payloads are built as JSON files (no shell interpolation of attacker text).
  merge:
    needs: gate
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, Windows, X64]
    env:
      PAT: ${{ secrets.PAT_TOKEN }}
      N: ${{ github.event.pull_request.number }}
      PYTHONIOENCODING: "utf-8"
      VERDICT: ${{ needs.gate.outputs.verdict }}
      BUILD: ${{ needs.gate.outputs.build }}
      REASONS: ${{ needs.gate.outputs.reasons }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Review and auto-merge
        shell: bash
        run: |
          set -euo pipefail
          : "${PAT:?PAT_TOKEN secret is not set}"
          # strip copied-in whitespace/newlines from the secret value (common "Bad credentials" cause)
          PAT="${PAT//[[:space:]]/}"
          export GH_TOKEN="$PAT"
          comment() {
            python - "$1" > "$RUNNER_TEMP/cmt.json" <<'PY'
          import json, sys
          print(json.dumps({"body": sys.argv[1]}))
          PY
            gh api --method POST "repos/$REPO/issues/$N/comments" --input "$RUNNER_TEMP/cmt.json" > /dev/null
          }
          fetch() {
            # gh api with retry (commit/PR APIs transiently 404 for 1-2 min after bot merges)
            for i in $(seq 1 12); do
              if gh api "$1" > "$2" 2> "$RUNNER_TEMP/fetch.err"; then return 0; fi
              echo "fetch-attempt $i url=$1 err=$(head -c 200 "$RUNNER_TEMP/fetch.err")"
              sleep 15
            done
            return 1
          }
          fetch "repos/$REPO/issues/$N" "$RUNNER_TEMP/issue.json" || exit 1
          labels=$(python -c "import json,sys;print(','.join(l['name'] for l in json.load(open(sys.argv[1], encoding='utf-8')).get('labels',[])))" "$RUNNER_TEMP/issue.json")
          # headmsg via PR commits endpoint (Pull requests scope); /commits/{sha} needs Contents read which the PAT lacks
          fetch "repos/$REPO/pulls/$N/commits?per_page=100" "$RUNNER_TEMP/pcommits.json" || exit 1
          headmsg=$(python -c "import json,sys;print(next((c['commit']['message'].splitlines()[0] for c in json.load(open(sys.argv[1], encoding='utf-8')) if c['commit']['message'].startswith('llm-task: implement')), ''))" "$RUNNER_TEMP/pcommits.json")
          if [ "$VERDICT" = "PASS" ] && [ "$BUILD" = "success" ]; then
            if echo "$labels" | grep -q "llm-task" && ! echo "$headmsg" | grep -q "^llm-task: implement"; then
              comment "pr-gate PASS — llm-task PR, holding merge until LLM implementation commit lands."
            else
              comment "pr-gate PASS (paths / deletion ratio / links / build). Auto-merged by pr-gate. verdict=$VERDICT build=$BUILD"
              # pin the audited head: a force-push after gate returns 409, merge never swallows it
              python - "$HEAD_SHA" > "$RUNNER_TEMP/merge.json" <<'PY'
          import json, sys
          print(json.dumps({"merge_method": "squash", "sha": sys.argv[1]}))
          PY
              merged=$(gh api --method PUT "repos/$REPO/pulls/$N/merge" --input "$RUNNER_TEMP/merge.json" --jq '.merged' || echo "false-failed")
              echo "merge merged=$merged (head sha pinned: $HEAD_SHA)"
              [ "$merged" = "true" ] || exit 1
              fetch "repos/$REPO/pulls/$N" "$RUNNER_TEMP/pr.json" || exit 1
              head_ref=$(python -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['head']['ref'])" "$RUNNER_TEMP/pr.json")
              gh api --method DELETE "repos/$REPO/git/refs/heads/$head_ref" > /dev/null || true
            fi
          else
            python - "$REASONS" "$VERDICT" "$BUILD" > "$RUNNER_TEMP/review.json" <<'PY'
          import json, sys
          reasons, verdict, build = sys.argv[1:4]
          print(json.dumps({"action": "request_changes", "body": f"pr-gate FAIL: verdict={verdict} build={build} — {reasons}"}))
          PY
            # reviews on owner-created PRs need a reviewer identity distinct from the author:
            # GITHUB_TOKEN (the bot), not the PAT.
            GH_TOKEN="${{ github.token }}" gh api --method POST "repos/$REPO/pulls/$N/reviews" --input "$RUNNER_TEMP/review.json" > /dev/null || true
            comment "pr-gate decision: verdict=$VERDICT build=$BUILD reasons=$REASONS"
          fi
