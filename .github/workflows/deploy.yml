name: Deploy AllusionistWikiLab (Quartz) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["PR gate (mechanical)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules cache
        id: npmcache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        if: steps.npmcache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
