name: Post-merge audit (LLM)

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audit-main
  cancel-in-progress: false

jobs:
  audit:
    # After registering the Strata machine as a self-hosted runner, switch to:
    #   runs-on: [self-hosted, strata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip audit/revert commits
        id: guard
        run: |
          msg=$(git log -1 --format=%s)
          author=$(git log -1 --format=%ae)
          case "$msg" in
            audit:*|Revert*) echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Owner/admin direct pushes are trusted; audit third-party merged content only.
          if [ "$author" = "allusionist.wiki@gmail.com" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit merged commit
        id: audit
        if: steps.guard.outputs.skip == 'false'
        env:
          STRATA_API_URL: ${{ secrets.STRATA_API_URL }}
          STRATA_API_KEY: ${{ secrets.STRATA_API_KEY }}
          STRATA_MODEL: ${{ secrets.STRATA_MODEL }}
        run: python3 scripts/audit_pr.py "${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Revert on reject
        if: steps.audit.outputs.verdict == 'REJECT'
        run: |
          git config user.name "allusionistwiki"
          git config user.email "allusionist.wiki@gmail.com"
          git revert -m 1 --no-edit "${{ github.sha }}"
          git push

      - name: Comment on source PR
        if: steps.audit.outputs.verdict == 'REJECT'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -n "$n" ]; then
            gh pr comment "$n" --body "Post-merge audit REJECT: ${{ steps.audit.outputs.reason }} — reverted ${{ github.sha }}"
          fi

      - name: Append audit log
        if: steps.guard.outputs.skip == 'false'
        run: |
          git pull --rebase
          mkdir -p audit
          printf '{"ts":"%s","sha":"%s","verdict":"%s","reason":"%s"}\n' \
            "$(date -u +%FT%TZ)" "${{ github.sha }}" \
            "${{ steps.audit.outputs.verdict }}" "${{ steps.audit.outputs.reason }}" \
            >> audit/audit-log.jsonl
          git config user.name "allusionistwiki"
          git config user.email "allusionist.wiki@gmail.com"
          git add audit/audit-log.jsonl
          git commit -m "audit: ${{ github.sha }} verdict=${{ steps.audit.outputs.verdict }}"
          git push
