name: Gate regression tests

on:
  push:
    branches: [main]
    paths: ['scripts/**']
  pull_request:
    paths: ['scripts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python -m pytest scripts/tests -q
